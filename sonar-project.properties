# Use the project-root compile_commands.json that `pio run -t compiledb`
# generates: it is produced by PlatformIO's Arduino Library Dependency Finder
# layer and includes the project's own lib/ sources (with full Arduino +
# ArduinoJson include paths). The copy under .pio/build/esp-wrover-kit/ comes
# from the ESP-IDF CMake build and omits lib/, so SonarQube would never analyze
# our own components if pointed there.
sonar.cfamily.compile-commands=compile_commands.json

# Suppress C++ rules that don't fit this ESP32 firmware. Filters the issues out
# of the CI scan only — it does not change the server quality profile or the
# SonarQube-for-IDE plugin.
#
# e1 cpp:S5945 ("use std::string/std::vector instead of a C-style array"):
#    we deliberately use fixed, stack-allocated char buffers sized to
#    protocol/hardware limits (SSID 32, IPv4 string 15, etc.) with the
#    length-bounded snprintf/strlcpy, to avoid heap allocation/fragmentation.
#    std::string would add heap churn for no safety gain here.
# e2 cpp:S6494 ("use std::format/std::print instead of C printf-like functions"):
#    std::format is C++20 and std::print is C++23; this project builds with
#    gnu++17, so it isn't even available. On an MCU it also adds flash size and
#    heap allocation versus snprintf to a fixed stack buffer. -Wformat already
#    catches the format/argument mismatch S6494 guards against.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S5945
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S6494
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*