# markdownlint-cli2 wrapper config: reuse the shared rules from
# .markdownlint.yaml and exclude third-party / generated Markdown so only
# our own documentation is linted.

config: ".markdownlint.yaml"

ignores:
  - ".pio/**"
  - "node_modules/**"
  - "managed_components/**"