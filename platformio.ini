; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
platform = espressif32@6.13.0
board = esp-wrover-kit
framework = espidf
monitor_speed = 115200
monitor_filters = colorize
monitor_raw = yes
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
	bblanchon/ArduinoJson@^7.2.2
	https://github.com/ElaadNL/resflex-open-s2-device-connector.git#v1.0.0
board_build.partitions = partitions.csv
platform_packages = 
;	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#master
	toolchain-xtensa-esp32
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D CONFIG_LOG_COLORS=1
	; Build ArduinoJson without the Arduino framework: force std::string instead of Arduino String.
	-D ARDUINOJSON_ENABLE_ARDUINO_STRING=0
	-D ARDUINOJSON_ENABLE_STD_STRING=1
	; The IDF 5.5.3 toolchain (GCC 13) is stricter and turns these into hard errors.
	; They are all pre-existing, harmless cases, so keep them as warnings instead of failing the build:
	;   comment           - ASCII-art banner comments with a backslash at end of line (multi-line comment).
	;   format-truncation - snprintf into a fixed-size buffer that could truncate (SSID/ifr_name).
	;   dangling-reference - false positive on ArduinoJson range-loops like s["x"].as<JsonArray>().
	-Wno-error=comment
	-Wno-error=format-truncation
	-Wno-error=dangling-reference

[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_ignore =
	modbus_component
	modbus_mapping_component
	storage_component
	eth_wifi_component
	ems_bridge_component
	led_component
	s2_library_wrapper
	time_component
	esp_websocket_client
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	--coverage
	-O0
	-g
	-include test/native_stubs/esp_err.h
	-Itest/native_stubs
	-Ilib/shared_types
	-Ilib/modbus_mapping_component
	-Ilib/storage_component
	-Ilib/modbus_component
	-Ilib/led_component
	-Ilib/ems_bridge_component
	-Ilib/eth_wifi_component
	-lgcov
build_src_filter =
	-<*>
	+<../lib/modbus_mapping_component/modbus_appliance_definition.cpp>
	+<../lib/modbus_mapping_component/modbus_mapping_component.cpp>
	+<../lib/modbus_mapping_component/modbus_mapping_cache.cpp>
	+<../lib/modbus_mapping_component/mapping_request_preprocessing.cpp>
	+<../lib/modbus_mapping_component/modbus_value_utils.cpp>
	+<../lib/ems_bridge_component/ems_bridge.cpp>
	+<../test/native_stubs/stubs.cpp>
	+<../test/native_stubs/s2_wrapper_stubs.cpp>
build_unflags =
	-std=gnu++11
lib_deps =
	bblanchon/ArduinoJson@^7.2.2
test_build_src = true
test_filter =
	test_modbus_mapping_native
	test_modbus_appliance_definition_native
	test_modbus_mapping_cache_native
	test_mapping_request_preprocessing_native
	test_ems_bridge_native

